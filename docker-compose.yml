services:
  api:
    build:
      context: .
    container_name: movie-agent-api
    command: ["python", "api_server.py", "--host", "0.0.0.0", "--port", "8026"]
    env_file:
      - .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "8026:8026"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build:
      context: .
    container_name: movie-agent-bot
    command: ["python", "bot/telegram_bot.py"]
    env_file:
      - .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cartelera:
    build:
      context: .
    container_name: movie-agent-cartelera
    command: ["python", "cartelera/cartelera_madrid.py", "--telegram"]
    env_file:
      - .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    restart: "no"
    profiles:
      - tools
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # POSTGRESQL — BASE DE DATOS DE N8N
  postgres:
    image: postgres:15-alpine
    container_name: postgres-n8n
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n123
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # N8N — WORKFLOWS
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n123
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      N8N_USER_FOLDER: /home/node/.n8n
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_PROCESS: main
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODES_EXCLUDE: "[]"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
